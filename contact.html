<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaamacadda Al-Azhar - Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="logo-arabic">جامعة الأزهر</span>
                <span class="logo-somali">Jaamacadda Al-Azhar</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="courses.html">Faculties</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="content-container" style="padding-top: 2rem;">
            <h2 class="section-title">Naga Soo Xiriir</h2>
            <div class="section-title-line"></div>
            
            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Magacaaga</label>
                    <input type="text" id="name" name="name" placeholder="Geli magacaaga" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail-kaaga</label>
                    <input type="email" id="email" name="email" placeholder="Geli e-mail-kaaga" required>
                </div>

                <div class="form-group">
                    <label for="subject">Mawduuca</label>
                    <input type="text" id="subject" name="subject" placeholder="Mawduuca fariinta" required>
                </div>

                <div class="form-group">
                    <label for="message">Fariintaada</label>
                    <textarea id="message" name="message" rows="5" placeholder="Halkan ku qor fariintaada..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Dir Fariinta</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jaamacadda Al-Azhar. Dhammaan xuquuqda waa la dhowray.</p>
    </footer>
</body>
</html>
